name: Tag Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: vars
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?([.-](RC|rc|alpha|beta)[0-9]*)?$ ]]; then
            echo "Formato inválido de tag: $TAG_NAME"
            exit 1
          fi

          IS_PRERELEASE=false
          if [[ "$VERSION" =~ ([.-](RC|rc|alpha|beta)[0-9]*)$ ]]; then
            IS_PRERELEASE=true
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists
        run: |
          git fetch --tags --force
          git rev-parse "refs/tags/${{ steps.vars.outputs.tag_name }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build distributions
        run: |
          ./gradlew \
            -Prelease.releaseVersion=${{ steps.vars.outputs.version }} \
            -Pversion=${{ steps.vars.outputs.version }} \
            clean assemble

      - name: Verify distributions
        run: |
          ls -lah build/distributions
          test -f "build/distributions/besu-${{ steps.vars.outputs.version }}.zip"
          test -f "build/distributions/besu-${{ steps.vars.outputs.version }}.tar.gz"

      - name: Generate checksums
        shell: bash
        run: |
          cd build/distributions
          sha256sum "besu-${{ steps.vars.outputs.version }}.zip" > "besu-${{ steps.vars.outputs.version }}.zip.sha256"
          sha256sum "besu-${{ steps.vars.outputs.version }}.tar.gz" > "besu-${{ steps.vars.outputs.version }}.tar.gz.sha256"

      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          ## ${{ steps.vars.outputs.tag_name }}

          Release generado automáticamente desde el tag \`${{ steps.vars.outputs.tag_name }}\`.

          Commit: \`${GITHUB_SHA}\`
          Pre-release: \`${{ steps.vars.outputs.is_prerelease }}\`

          ### Assets
          - besu-${{ steps.vars.outputs.version }}.zip
          - besu-${{ steps.vars.outputs.version }}.tar.gz
          - besu-${{ steps.vars.outputs.version }}.zip.sha256
          - besu-${{ steps.vars.outputs.version }}.tar.gz.sha256
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.tag_name }}
          body_path: release-notes.md
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          draft: false
          files: |
            build/distributions/besu-${{ steps.vars.outputs.version }}.zip
            build/distributions/besu-${{ steps.vars.outputs.version }}.tar.gz
            build/distributions/besu-${{ steps.vars.outputs.version }}.zip.sha256
            build/distributions/besu-${{ steps.vars.outputs.version }}.tar.gz.sha256
